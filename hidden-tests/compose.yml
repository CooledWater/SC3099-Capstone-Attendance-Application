# Entirely separate from the application's Compose project; no published ports
# and no persistent database volumes. Tests start their own local real Redis.
services:
  hidden-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hidden
      POSTGRES_PASSWORD: hidden-disposable-password
      POSTGRES_DB: hidden_compat
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/hidden.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hidden -d hidden_compat]
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ..
      dockerfile: hidden-tests/Dockerfile
    depends_on:
      hidden-db:
        condition: service_healthy
    environment:
      SAIV_HIDDEN_COMPOSE: '1'
    volumes:
      - ${HIDDEN_TEST_RESULTS_DIR:-/tmp/saiv-hidden-results}:/results
    command: [--postgres, --include-interpretations, --run-stress, --junitxml=/results/hidden-tests.xml]

