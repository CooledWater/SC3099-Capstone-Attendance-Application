[pytest]
testpaths = hidden-tests
python_files = test_*.py
addopts = -ra --tb=short -p no:cacheprovider
junit_family = legacy
markers =
    specification: requirement stated in docs
    interpretation: additional hidden-test interpretation; see README
    native: executes actual face/PAD/landmark models
    physical: requires an independently labelled physical-capture manifest
    stress: 100-user workload; opt in with --run-stress
    postgres: requires the disposable PostgreSQL profile

